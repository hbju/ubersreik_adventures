    <path class="street" d="M160 160L250 450M330 110L410 458M530 88L566 462M736 82L734 470M944 82L914 466M1148 92L1082 462M1360 126L1256 460"/>
    <path class="street" d="M88 248C390 190 650 230 838 190S1252 170 1510 246M82 346C344 294 638 342 846 302S1266 292 1514 350"/>
