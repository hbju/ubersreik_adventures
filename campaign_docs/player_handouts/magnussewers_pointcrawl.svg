<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Les Magnussewers — carte de progression du MJ</title>
  <desc id="desc">Carte point-crawl stylisée des égouts nord d'Ubersreik, avec huit lieux reliés par des conduits.</desc>
  <defs>
    <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence baseFrequency=".018" numOctaves="4" seed="19" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="grey"/>
      <feBlend in="SourceGraphic" in2="grey" mode="multiply"/>
    </filter>
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".012" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="brick" width="64" height="32" patternUnits="userSpaceOnUse">
      <path d="M0 0H64M0 16H64M0 32H64M32 0V16M16 16V32" fill="none" stroke="#6f6656" stroke-opacity=".16" stroke-width="2"/>
    </pattern>
    <style>
      .route{fill:none;stroke:#171512;stroke-width:11;stroke-linecap:round;stroke-linejoin:round;filter:url(#rough)}
      .known{stroke:#171512}.hidden{stroke:#6b1d18;stroke-dasharray:22 15}.flooded{stroke:#254e57;stroke-dasharray:7 14}
      .node{fill:#15130f;stroke:#d4c6a5;stroke-width:5}.danger{fill:#7c211b}.safe{fill:#315447}.unknown{fill:#c29a43}
      .label{font-family:Georgia,serif;font-size:25px;font-weight:700;fill:#1e1a14;paint-order:stroke;stroke:#d8cbaa;stroke-width:7px;stroke-linejoin:round}
      .small{font-family:Georgia,serif;font-size:18px;font-style:italic;fill:#3d3429}
      .key{font-family:Arial,sans-serif;font-size:18px;fill:#2a241d}
    </style>
  </defs>
  <rect width="1400" height="900" fill="#b6aa89"/>
  <rect x="28" y="26" width="1344" height="848" rx="22" fill="#d8cbaa" stroke="#564d3e" stroke-width="5" filter="url(#paper)"/>
  <rect x="50" y="50" width="1300" height="800" fill="url(#brick)"/>
  <path d="M70 130 C250 70 410 155 585 95 S960 65 1330 150" fill="none" stroke="#65777a" stroke-width="80" opacity=".32"/>
  <text x="85" y="92" class="small">Sous la rive nord du Teufel — conduits anciens, niveaux approximatifs</text>

  <!-- primary traversable network -->
  <path class="route known" d="M145 670 C245 680 275 590 360 575 S515 625 600 565"/>
  <path class="route known" d="M360 575 C355 465 435 430 505 365"/>
  <path class="route known" d="M505 365 C620 305 700 385 785 330"/>
  <path class="route known" d="M600 565 C705 605 790 555 880 530"/>
  <path class="route known" d="M880 530 C965 485 1040 455 1135 480"/>
  <path class="route known" d="M785 330 C885 285 970 330 1060 285"/>
  <path class="route known" d="M1060 285 C1135 305 1195 355 1235 420"/>
  <path class="route hidden" d="M1135 480 C1165 405 1170 335 1060 285"/>
  <path class="route hidden" d="M880 530 C900 655 1050 705 1195 665"/>
  <path class="route flooded" d="M600 565 C575 705 690 760 820 735 S1050 730 1195 665"/>

  <!-- minor dead ends -->
  <path class="route" style="stroke-width:6;opacity:.55" d="M360 575C300 500 265 455 205 450M505 365C470 285 505 235 565 205M785 330C760 245 820 205 885 185M1135 480C1245 510 1290 565 1280 625"/>

  <!-- nodes -->
  <circle class="node safe" cx="145" cy="670" r="23"/><text class="label" x="75" y="725">1. Porte de la Guilde</text>
  <circle class="node" cx="360" cy="575" r="23"/><text class="label" x="205" y="545">2. Carrefour des os</text>
  <circle class="node danger" cx="505" cy="365" r="23"/><text class="label" x="430" y="420">3. Tanière du troll</text>
  <circle class="node safe" cx="600" cy="565" r="23"/><text class="label" x="500" y="625">4. Refuge effondré</text>
  <circle class="node danger" cx="785" cy="330" r="23"/><text class="label" x="670" y="285">5. Ancien repaire</text>
  <circle class="node unknown" cx="880" cy="530" r="23"/><text class="label" x="760" y="585">6. Geôles</text>
  <circle class="node danger" cx="1060" cy="285" r="25"/><text class="label" x="915" y="240">7. Atelier du Technomage</text>
  <circle class="node danger" cx="1135" cy="480" r="27"/><text class="label" x="1040" y="545">8. Sape des Casernes</text>
  <circle class="node safe" cx="1195" cy="665" r="23"/><text class="label" x="1075" y="720">9. Déversoir du Teufel</text>

  <!-- key and operational notes -->
  <g transform="translate(76 150)">
    <rect width="350" height="215" rx="8" fill="#e4d8b9" fill-opacity=".92" stroke="#554b3a" stroke-width="3"/>
    <text x="22" y="36" class="label" style="font-size:23px;stroke-width:5px">LÉGENDE DU MJ</text>
    <line x1="25" y1="70" x2="105" y2="70" stroke="#171512" stroke-width="8" stroke-linecap="round"/><text x="125" y="77" class="key">Conduit praticable</text>
    <line x1="25" y1="108" x2="105" y2="108" stroke="#6b1d18" stroke-width="8" stroke-dasharray="18 10" stroke-linecap="round"/><text x="125" y="115" class="key">Passage skaven secret</text>
    <line x1="25" y1="146" x2="105" y2="146" stroke="#254e57" stroke-width="8" stroke-dasharray="5 10" stroke-linecap="round"/><text x="125" y="153" class="key">Conduit noyé</text>
    <circle class="node danger" cx="48" cy="184" r="13"/><text x="78" y="191" class="key">Menace active</text>
    <circle class="node safe" cx="220" cy="184" r="13"/><text x="250" y="191" class="key">Issue / refuge</text>
  </g>
  <g transform="translate(70 774)">
    <text class="small"><tspan x="0" dy="0">Chaque liaison : 10–20 min • Navigation Moyenne (+20) si connue, Intermédiaire (+0) sinon.</tspan><tspan x="0" dy="27">Sur échec : temps, bruit ou rencontre — jamais un cul-de-sac sans choix.</tspan></text>
  </g>
  <text x="1130" y="820" class="small">Carte non remise aux joueurs</text>
</svg>
