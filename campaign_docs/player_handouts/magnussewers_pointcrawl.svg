<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">Les égouts d’Ubersreik — schéma opérationnel du MJ</title>
  <desc id="desc">Carte schématique de l’ensemble des égouts d’Ubersreik. Les Magnussewers et le camp skaven sont au nord du Teufel. Les Sigmarsewers et l’entrée de la Guilde des Attrapeurs de Rats sont au sud.</desc>
  <defs>
    <filter id="paper" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence baseFrequency=".018" numOctaves="4" seed="19" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="grey"/>
      <feBlend in="SourceGraphic" in2="grey" mode="multiply"/>
    </filter>
    <filter id="rough" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency=".012" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="ledger" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M0 0H56M0 28H56M0 56H56M0 0V56M28 0V56M56 0V56" fill="none" stroke="#6f6656" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <pattern id="water" width="80" height="30" patternUnits="userSpaceOnUse">
      <path d="M0 10C18 2 30 18 48 10S70 2 88 10M-20 25C-2 17 10 33 28 25S50 17 68 25" fill="none" stroke="#b6c4bf" stroke-opacity=".32" stroke-width="3"/>
    </pattern>
    <style>
      .wall{fill:none;stroke:#736956;stroke-width:4;stroke-dasharray:14 10;opacity:.75}
      .street{fill:none;stroke:#766c5b;stroke-width:3;opacity:.25}
      .major{fill:none;stroke:#171512;stroke-width:11;stroke-linecap:round;stroke-linejoin:round;filter:url(#rough)}
      .minor{fill:none;stroke:#3f3a32;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;opacity:.72}
      .hidden{fill:none;stroke:#7c211b;stroke-width:10;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:22 15;filter:url(#rough)}
      .flooded{fill:none;stroke:#315d66;stroke-width:9;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:7 14}
      .transfer{fill:none;stroke:#c29a43;stroke-width:7;stroke-linecap:round;stroke-dasharray:8 12}
      .node{fill:#171512;stroke:#e0d5b8;stroke-width:5}
      .danger{fill:#7c211b}.safe{fill:#315447}.unknown{fill:#c29a43}.manhole{fill:#171512;stroke:#d8cbaa;stroke-width:3}
      .title{font-family:Georgia,serif;font-size:34px;font-weight:700;letter-spacing:1px;fill:#211e1a}
      .region{font-family:Arial,sans-serif;font-size:25px;font-weight:700;letter-spacing:2px;fill:#211e1a}
      .district{font-family:Arial,sans-serif;font-size:17px;font-weight:700;letter-spacing:1.5px;fill:#655b4b;opacity:.8}
      .label{font-family:Georgia,serif;font-size:21px;font-weight:700;fill:#211e1a;paint-order:stroke;stroke:#ded2b3;stroke-width:6px;stroke-linejoin:round}
      .label-small{font-family:Georgia,serif;font-size:18px;font-weight:700;fill:#211e1a;paint-order:stroke;stroke:#ded2b3;stroke-width:5px;stroke-linejoin:round}
      .note{font-family:Georgia,serif;font-size:17px;font-style:italic;fill:#40382d}
      .key{font-family:Arial,sans-serif;font-size:16px;fill:#2a241d}
      .key-strong{font-family:Arial,sans-serif;font-size:17px;font-weight:700;fill:#5c0011}
    </style>
  </defs>

  <rect width="1600" height="1100" fill="#a89c7d"/>
  <rect x="24" y="22" width="1552" height="1056" rx="20" fill="#d8cbaa" stroke="#51493b" stroke-width="5"/>
  <rect x="44" y="42" width="1512" height="1016" fill="url(#ledger)"/>

