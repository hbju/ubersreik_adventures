  <text x="800" y="580" text-anchor="middle" style="font-family:Arial,sans-serif;font-size:16px;letter-spacing:1px;fill:#d8e1dc">AUCUNE CONNEXION SOUTERRAINE DIRECTE CONNUE</text>
