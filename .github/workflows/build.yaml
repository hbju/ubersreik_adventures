name: Build/Release

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.0.0, v1.2.3

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      # Build the Shared Library first
      - name: Build Shared
        run: npm run build:shared

      # Build the Player App (renderer only, without electron-builder)
      - name: Build Player App Renderer
        run: npm run build:renderer -w @wfrp/player-app

      # Build Electron app with electron-builder
      - name: Build Electron App (Windows)
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win --publish never
        working-directory: packages/player-app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Electron App (macOS)
        if: matrix.os == 'macos-latest'
        run: npx electron-builder --mac --publish never
        working-directory: packages/player-app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Upload the result so you can download it
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: player-app-${{ matrix.os }}
          path: packages/player-app/release/

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: player-app-windows-latest
          path: release/windows

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: player-app-macos-latest
          path: release/macos

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/windows/**/*.exe
            release/windows/**/*.exe.blockmap
            release/windows/**/latest.yml
            release/macos/**/*.dmg
            release/macos/**/*.zip
            release/macos/**/*.zip.blockmap
            release/macos/**/latest-mac.yml
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
